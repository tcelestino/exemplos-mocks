name: Rodando testes

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configuração do Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Executando teste 1 (filmes)
        run: deno test filmes.test.ts

  test-2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configuração do Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Executando teste 2 (filmes-v1)
        run: deno test filmes_v1.test.ts
